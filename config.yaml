# Non-secret settings only. Secrets (SECRET_KEY, API_KEY, POSTGRES_USER,
# POSTGRES_PASSWORD) come from the environment — see .envrc.example.
# POSTGRES_HOST / POSTGRES_PORT / POSTGRES_DATABASE override the database block.
app:
  debug: false
database:
  host: "192.168.1.91"
  port: 5434
  name: "coffee-records"
  pool_size: 5
logging:
  level: "INFO"
  format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
server:
  host: "0.0.0.0"
  port: 5000
  workers: 4
uploads:
  media_dir: "/resources"
  coffee_image_base_url: "https://resources.drskippy.app/coffee"
reports:
  default_range_days: 30
grind_model:
  reference_temp_f: 65.0      # grinder temperature features are centered here
  reference_dose_g: 20.0      # dose features are centered here
  target_brew_ratio: 2.0      # yield feature = final_weight - ratio * dose
  min_within_coffee_range: 0.5  # features varying less than this within every coffee get coefficient 0
  min_points: 3               # minimum usable shots to fit a regression/model
  stored_decimals: 8          # decimals kept when persisting model coefficients
  point_decimals: 4           # decimals for per-shot data points in reports
  coefficient_decimals: 6    # decimals for regression coefficients in reports
  espresso_drink_types: [americano, latte, cappuccino]
grinders:
  dual_scale_keywords: ["mazzer"]           # "8+7 1/2" notation
  single_number_keywords: ["option-o", "timemore", "baratza"]  # "19.5" notation
  dual_scale_min_value: 30.0  # numeric grind values below this are single-number settings
matching:
  coffee_name_threshold: 0.8
  roaster_threshold: 0.5
  token_overlap_threshold: 0.5
  equipment_min_overlap: 0.5
brewmeo:
  flow_smoothing_tenths: 5
  flow_half_window_tenths: 5
  disturbance_grams: 5.0      # a weight jump this large this fast is a bumped cup
  disturbance_seconds: 0.25
  disturbance_tail_fraction: 0.2
  final_weight_tolerance_grams: 2.0
telemetry_phases:            # pre-infusion / shot time estimation (notebooks/telemetry_phases)
  grid_step_s: 0.05           # breakpoint search resolution
  median_half_width: 2        # running-median half width (samples) to remove spikes
  zero_pressure_bar: 0.3      # below this counts as no pressure
  truncated_start_bar: 3.0    # a recording starting above this began mid-shot
  pump_off_bar: 0.7           # final drop starts after the last sample above this
  plateau_lookback_s: 2.0     # plateau seconds fitted before the final drop
  flow_fit_max_g: 4.0         # flow-onset fit window ends at this cup weight
  pump_on_offset_s: 2.65      # pump-on lead for recordings that auto-start pressurised
  profile_end_ratio: 0.65     # plateau ending below this fraction of peak = profiled
  profile_rmse_bar: 0.15      # plateau deviating more than this from a smooth decline = profiled
  pump_on_reach: 0.7          # pump-on fit window ends at this fraction of the pre-infusion plateau
  ramp_reach: 0.6             # ramp fit window ends at this fraction of peak pressure
  peak_reach: 0.9             # brew plateau starts at this fraction of peak pressure
  peak_percentile: 95         # percentile of pressure samples used as "peak"
  low_peak_bar: 6.0           # peak below this flags a low-pressure shot
  flow_before_ramp_s: 1.0     # flow starting this far before the ramp is an issue
  min_pressure_samples: 20    # fewer pressure samples = no usable telemetry
  pump_off_tail_s: 0.3       # seconds past the first zero sample included in the pump-off fit
  ramp_fit_start_s: 0.5       # ramp fit window starts this far after pump on
  plateau_floor_bar: 1.0     # assumed pre-infusion plateau when no early samples exist
  profile_start_margin_s: 1.0 # profile fit grid starts this far after the peak crossing
  profile_end_margin_s: 0.5   # profile fit grid ends this far before pump off
  profile_grid_step_s: 0.1   # profile fit grid resolution
  profile_min_samples: 20    # profile fit needs at least this many grid points
  profile_end_samples: 10    # plateau end ratio = median of this many final grid points
shot_defaults_seed:
  maker: "Scott"
  dose_weight: 20.0
  pre_infusion_time: "5+5"
  extraction_time: 28.0
  final_weight: 40.0
  drink_type: "americano"
  grinder_temp_before: 64.0
  wedge: true
  shaker: true
  wdt: true
  flow_taper: false
