name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: black
        run: poetry run black --check coffee_records bin test
      - name: mypy
        run: poetry run mypy coffee_records bin
      - name: pytest
        run: poetry run pytest
